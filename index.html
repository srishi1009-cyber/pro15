<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d"><title>Rishi Music</title>
<style>
:root{--accent:#1d72fe;--rgb:29,114,254;--bg:#08090d;--card:#141720;--text:#eef1f8;--mut:#8b93a7;--glass:rgba(20,23,32,.72);--line:rgba(255,255,255,.08)}
:root[data-theme=light]{--bg:#f4f7fb;--card:#fff;--text:#12161f;--mut:#5d6679;--glass:rgba(255,255,255,.78);--line:rgba(0,0,0,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:0 14px 170px}
body.anim *{transition:.2s ease}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
h1{margin:0;font-size:22px;flex:1}h1 span{color:var(--accent)}
button,select,input{font:inherit;color:var(--text)}
.btn{border:0;background:var(--card);border-radius:999px;padding:9px 15px;cursor:pointer;border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:#fff;border:0;box-shadow:0 0 16px rgba(var(--rgb),.5)}
.ic{width:40px;height:40px;padding:0;font-size:18px}
.search{flex:1;display:flex;background:var(--card);border-radius:999px;border:1px solid var(--line);padding:0 6px 0 14px;align-items:center}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0;min-width:0}
.search .mic.on{background:#e5484d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.25)}}
select{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 12px;max-width:100%}
.tabs{display:flex;gap:6px;overflow:auto}.tabs .btn{white-space:nowrap;padding:7px 13px}
.tabs .btn.on{background:rgba(var(--rgb),.18);border-color:var(--accent);color:var(--accent)}
#list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;align-items:center;gap:10px}
.tc.active{border-color:var(--accent);box-shadow:0 0 18px rgba(var(--rgb),.35)}
.grid .tc{flex-direction:column;align-items:stretch;text-align:center}
.art{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7c4dff);display:grid;place-items:center;color:#fff;flex:none}
.grid .art{width:100%;height:90px;font-size:30px}
body.noart .art{display:none}
.tx{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{color:var(--mut);font-size:12px;margin-top:2px}
.acts{display:flex;gap:4px;justify-content:center}.acts .btn{width:34px;height:34px;padding:0}
.fav{color:#ff4d6d}
#dock{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:12px 14px;z-index:6;box-shadow:0 8px 30px rgba(0,0,0,.35)}
body.compact #dock{padding:6px 12px}body.compact #dock .sub,body.compact #prog{display:none}
#dock .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .sub{color:var(--mut);font-size:12px}
#prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin:6px 0}
input[type=range]{accent-color:var(--accent);flex:1;width:100%}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px}
.ctl .on{color:var(--accent);border-color:var(--accent)}
.play{width:54px;height:54px;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.panel{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;box-shadow:0 0 40px rgba(var(--rgb),.25)}
@media(min-width:600px){.modal{align-items:center}.panel{border-radius:26px}}
.panel h2{margin:0 0 4px}.panel h3{margin:18px 0 8px;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.set label{flex:1}.set input[type=range]{max-width:150px}
.sw{appearance:none;width:44px;height:26px;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none}
.sw:checked{background:var(--accent)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked::after{left:21px}
.prev{margin:8px 0;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.prev b{background:var(--pc);color:#fff;border-radius:99px;padding:8px 16px;box-shadow:0 0 16px var(--pc)}
.hex{width:90px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style></head>
<body class="anim">
<header>
 <div class="row"><h1>Rishi <span>Music</span></h1>
  <button class="btn" id="installBtn" style="display:none">Install</button>
  <button class="btn ic" id="settingsBtn" aria-label="Settings">⚙️</button></div>
 <div class="row"><div class="search"><input id="q" placeholder="Search songs or directors…">
  <button class="btn ic mic" id="mic" aria-label="Voice search">🎤</button></div>
  <button class="btn pri" id="imp">+ Import</button></div>
 <div class="row"><select id="dir"></select><button class="btn" id="viewBtn">▦ Grid</button></div>
 <div class="tabs" id="tabs"></div>
</header>
<div id="list"></div>
<input type="file" id="files" accept="audio/*" multiple hidden>
<audio id="au" preload="auto"></audio>

<div id="dock">
 <div class="t" id="dT">No track playing</div><div class="sub" id="dS">Select a song from your library</div>
 <div id="prog"><span id="cur">0:00</span><input type="range" id="bar" min="0" max="100" step=".1" value="0"><span id="dur">0:00</span></div>
 <div class="ctl"><button class="btn ic" id="shufBtn">🔀</button><button class="btn ic" id="prev">⏮</button>
 <button class="btn pri play" id="play">▶</button><button class="btn ic" id="next">⏭</button><button class="btn ic" id="repBtn">🔁</button></div>
</div>

<div class="modal" id="sm"><div class="panel">
 <div class="row"><h2 style="flex:1">Settings</h2><button class="btn ic" id="sx">✕</button></div>
 <h3>Appearance</h3>
 <div class="set"><label>Theme</label><select id="theme"><option value="system">System default</option><option value="dark">🌙 Dark</option><option value="light">☀️ Light</option></select></div>
 <div class="set"><label>Accent colour</label><input type="color" id="cp"><input class="hex" id="hx" maxlength="7"></div>
 <div class="set"><label>R</label><input type="range" id="r" max="255"></div>
 <div class="set"><label>G</label><input type="range" id="g" max="255"></div>
 <div class="set"><label>B</label><input type="range" id="b" max="255"></div>
 <div class="prev" id="pv"><b>Preview</b><span class="sb">Live preview — tap Apply to keep</span></div>
 <div class="row"><button class="btn pri" id="apply">Apply colour</button><button class="btn" id="resetA">Reset appearance</button></div>
 <h3>Playback</h3>
 <div class="set"><label>Autoplay next song</label><input type="checkbox" class="sw" id="autoplay"></div>
 <div class="set"><label>Gapless playback</label><input type="checkbox" class="sw" id="gapless"></div>
 <div class="set"><label>Crossfade <span id="cfv"></span></label><input type="range" id="cf" min="0" max="10"></div>
 <div class="set"><label>Default volume <span id="vv"></span></label><input type="range" id="vol" max="100"></div>
 <div class="set"><label>Playback speed</label><select id="spd"><option>0.75</option><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select></div>
 <div class="set"><label>Remember last position</label><input type="checkbox" class="sw" id="remember"></div>
 <div class="set"><label>Shuffle</label><input type="checkbox" class="sw" id="shuffle"></div>
 <div class="set"><label>Repeat</label><select id="repeat"><option value="off">Off</option><option value="all">All</option><option value="one">One</option></select></div>
 <h3>Music library</h3>
 <div class="set"><label>Sort by</label><select id="sort"><option value="name">Song name</option><option value="director">Director</option><option value="recent">Recently added</option></select></div>
 <div class="set"><label>View</label><select id="view"><option value="list">List</option><option value="grid">Grid</option></select></div>
 <h3>App</h3>
 <div class="set"><label>Animations</label><input type="checkbox" class="sw" id="anim"></div>
 <div class="set"><label>Compact player</label><input type="checkbox" class="sw" id="compact"></div>
 <div class="set"><label>Show artwork</label><input type="checkbox" class="sw" id="art"></div>
 <div class="set"><label>Songs</label><span id="cnt"></span></div>
 <div class="set"><label>Storage used</label><span id="stor"></span></div>
 <div class="row" style="margin-top:12px"><button class="btn" id="exp">Export library backup</button><button class="btn pri" id="done" style="margin-left:auto">Done</button></div>
</div></div>

<script>
"use strict";
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
const $=id=>document.getElementById(id),au=$("au"),LS=localStorage;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jget=(k,d)=>{try{return JSON.parse(LS.getItem(k))||d}catch(e){return d}},jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch(e){}};

/* DB (same as before, so old songs remain) */
const S="audio_library";let db;
const initDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("RishiMusicDB_v4",1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(S))e.target.result.createObjectStore(S,{keyPath:"id"})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const allMeta=()=>new Promise(res=>{const o=[];const q=db.transaction(S).objectStore(S).openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){o.push({id:c.value.id,title:c.value.title,director:c.value.director});c.continue()}else res(o)};q.onerror=()=>res(o)});
const getRec=id=>new Promise((res,rej)=>{const q=db.transaction(S).objectStore(S).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const putRecs=a=>new Promise((res,rej)=>{const t=db.transaction(S,"readwrite");a.forEach(x=>t.objectStore(S).put(x));t.oncomplete=res;t.onerror=rej});
const delRec=id=>new Promise(res=>{const t=db.transaction(S,"readwrite");t.objectStore(S).delete(id);t.oncomplete=res});

/* Settings */
const DEF={theme:"system",accent:"#1d72fe",autoplay:true,gapless:false,crossfade:0,volume:100,speed:1,remember:true,shuffle:false,repeat:"off",sort:"name",view:"list",anim:true,compact:false,art:true};
let st={...DEF,...jget("rishi_settings_v2",{})};
const save=()=>jset("rishi_settings_v2",st);
const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const toHex=(r,g,b)=>"#"+[r,g,b].map(v=>(+v).toString(16).padStart(2,"0")).join("");
const mq=matchMedia("(prefers-color-scheme: dark)");
function apply(){
 const dark=st.theme==="system"?mq.matches:st.theme==="dark",R=document.documentElement;
 R.dataset.theme=dark?"dark":"light";R.style.setProperty("--accent",st.accent);R.style.setProperty("--rgb",rgbOf(st.accent).join(","));
 document.querySelector('meta[name=theme-color]').content=dark?"#08090d":"#f4f7fb";
 document.body.classList.toggle("anim",st.anim);document.body.classList.toggle("compact",st.compact);document.body.classList.toggle("noart",!st.art);
 au.playbackRate=+st.speed;baseVol();
 $("shufBtn").classList.toggle("on",st.shuffle);$("repBtn").classList.toggle("on",st.repeat!=="off");
 $("repBtn").textContent=st.repeat==="one"?"🔂":"🔁";
 $("list").classList.toggle("grid",st.view==="grid");$("viewBtn").textContent=st.view==="grid"?"☰ List":"▦ Grid";
}
mq.addEventListener("change",apply);
function set(c){st={...st,...c};save();apply()}

/* State & stats */
let tracks=[],cur=-1,url=null,tab="all",shown=0,view=[],q=null;
let favs=jget("rishi_favs",[]),plays=jget("rishi_plays",{}),recent=jget("rishi_recent",[]);
const added=t=>+(/^track_(\d+)_/.exec(t.id)||[0,0])[1];
const fmt=s=>!isFinite(s)||s<0?"0:00":Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const baseVol=()=>{au.volume=Math.max(0,Math.min(1,st.volume/100))};

/* Library view */
function compute(){
 const s=$("q").value.trim().toLowerCase(),d=$("dir").value||"ALL";
 let a=tracks.map((t,i)=>i).filter(i=>{const t=tracks[i];return(!s||t.title.toLowerCase().includes(s)||t.director.toLowerCase().includes(s))&&(d==="ALL"||t.director===d)});
 if(tab==="fav")a=a.filter(i=>favs.includes(tracks[i].id));
 if(tab==="recent"){a=recent.map(id=>tracks.findIndex(t=>t.id===id)).filter(i=>a.includes(i))}
 else if(tab==="most"){a=a.filter(i=>plays[tracks[i].id]).sort((x,y)=>plays[tracks[y].id]-plays[tracks[x].id])}
 else a.sort((x,y)=>st.sort==="recent"?added(tracks[y])-added(tracks[x]):st.sort==="director"?tracks[x].director.localeCompare(tracks[y].director)||tracks[x].title.localeCompare(tracks[y].title):tracks[x].title.localeCompare(tracks[y].title));
 view=a;
}
function card(i){
 const t=tracks[i],on=i===cur,pl=on&&!au.paused,f=favs.includes(t.id);
 return `<div class="tc${on?" active":""}"><div class="art">♬</div><div class="tx"><div class="nm">${esc(t.title)}</div><div class="sb">${esc(t.director)}${plays[t.id]?` · ▶ ${plays[t.id]}`:""}</div></div>
 <div class="acts"><button class="btn fav" data-a="fav" data-id="${t.id}">${f?"♥":"♡"}</button><button class="btn" data-a="edit" data-id="${t.id}">✎</button><button class="btn" data-a="del" data-id="${t.id}">🗑</button><button class="btn pri" data-a="play" data-i="${i}">${pl?"❚❚":"▶"}</button></div></div>`;
}
function more(n=40){const e=Math.min(shown+n,view.length);$("list").insertAdjacentHTML("beforeend",view.slice(shown,e).map(card).join(""));shown=e}
function render(){
 compute();const L=$("list");L.innerHTML="";shown=0;
 if(!tracks.length)L.innerHTML='<div class="empty">Your library is empty.<br>Tap <b>+ Import</b> to add songs.</div>';
 else if(!view.length)L.innerHTML='<div class="empty">Nothing here yet.</div>';
 else more();
}
function refresh(){ // lightweight re-render keeping scroll
 const y=scrollY,n=shown;compute();$("list").innerHTML="";shown=0;if(view.length)more(Math.max(n,40));scrollTo(0,y)}
addEventListener("scroll",()=>{if(innerHeight+scrollY>=document.body.offsetHeight-500&&shown<view.length)more()});
function dirs(){const c=$("dir").value||"ALL",d=[...new Set(tracks.map(t=>t.director))].filter(Boolean).sort();
 $("dir").innerHTML='<option value="ALL">ALL DIRECTORS</option>'+d.map(x=>`<option>${esc(x)}</option>`).join("");$("dir").value=d.includes(c)?c:"ALL"}
$("tabs").innerHTML=[["all","All"],["recent","🕘 Recent"],["most","🔥 Most played"],["fav","♥ Favourites"]].map(([k,v])=>`<button class="btn${k==="all"?" on":""}" data-t="${k}">${v}</button>`).join("");
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("q").oninput=render;$("dir").onchange=render;
$("viewBtn").onclick=()=>{set({view:st.view==="grid"?"list":"grid"})};

/* Playback */
let pre=null; // preloaded {idx,url}
function pickNext(dir=1){
 if(!tracks.length)return -1;
 if(!view.length)compute();
 const pool=view.length?view:tracks.map((t,i)=>i);
 if(st.shuffle){const c=pool.filter(i=>i!==cur);return c.length?c[Math.random()*c.length|0]:pool[0]}
 const p=pool.indexOf(cur);if(p<0)return pool[0];
 const n=p+dir;if(n>=0&&n<pool.length)return pool[n];
 return st.repeat==="all"?pool[(n+pool.length)%pool.length]:-1;
}
async function load(i,preUrl){
 if(i<0||i>=tracks.length)return false;
 const t=tracks[i];let u=preUrl;
 if(!u){const r=await getRec(t.id);if(!r||!r.blob)return false;u=URL.createObjectURL(r.blob)}
 if(url)URL.revokeObjectURL(url);url=u;cur=i;au.src=u;au.playbackRate=+st.speed;
 $("dT").textContent=t.title;$("dS").textContent=t.director;$("bar").value=0;
 if(pre&&pre.url!==u){URL.revokeObjectURL(pre.url)}pre=null;
 media(t);return true;
}
async function play(){
 if(cur<0&&tracks.length){compute();const i=view[0]??0;if(!await load(i))return}
 try{await au.play()}catch(e){}
 syncIcons()}
function pause(){au.pause();syncIcons()}
function syncIcons(){$("play").textContent=au.paused?"▶":"❚❚";if("mediaSession"in navigator)navigator.mediaSession.playbackState=au.paused?"paused":"playing";refresh()}
function count(){const id=tracks[cur]?.id;if(!id)return;plays[id]=(plays[id]||0)+1;recent=[id,...recent.filter(x=>x!==id)].slice(0,50);jset("rishi_plays",plays);jset("rishi_recent",recent)}
let busy=false;
async function go(dir=1,auto=false){
 if(busy)return;busy=true;
 try{
  if(auto&&st.repeat==="one"){au.currentTime=0;await play();return}
  const n=pre&&auto&&st.gapless?pre.idx:pickNext(dir);
  if(n<0){pause();$("dT").textContent="End of queue";return}
  if(await load(n,pre&&pre.idx===n?pre.url:null))await play();
 }finally{busy=false}
}
async function preload(){
 if(!st.gapless||pre)return;const n=pickNext(1);if(n<0||n===cur)return;
 try{const r=await getRec(tracks[n].id);if(r&&r.blob&&!pre)pre={idx:n,url:URL.createObjectURL(r.blob)}}catch(e){}
}
function prevTrack(){if(au.currentTime>3){au.currentTime=0;return}go(-1)}
let lastSave=0,ended=false;
au.onplay=()=>{ended=false;count();preload();syncIcons()};
au.onpause=syncIcons;
au.onended=()=>{if(ended)return;ended=true;st.autoplay||st.repeat==="one"?go(1,true):syncIcons()};
au.onerror=()=>{if(!busy&&tracks[cur])go(1,true)};
au.ontimeupdate=()=>{
 const d=au.duration,t=au.currentTime;if(!d)return;
 $("bar").value=t/d*100;$("cur").textContent=fmt(t);$("dur").textContent=fmt(d);
 const cf=+st.crossfade;let v=st.volume/100;
 if(cf>0&&d>cf*2){if(t<cf)v*=t/cf;if(d-t<cf)v*=Math.max(0,(d-t)/cf)}
 au.volume=Math.max(0,Math.min(1,v));
 if((cf>0||st.gapless)&&d-t<(st.gapless&&!cf?.25:.4)&&!ended&&st.autoplay&&!au.paused){ended=true;go(1,true)}
 if(st.remember&&Date.now()-lastSave>3000){lastSave=Date.now();jset("rishi_pos",{id:tracks[cur]?.id,t})}
};
$("bar").oninput=()=>{if(au.duration)au.currentTime=$("bar").value/100*au.duration};
$("play").onclick=()=>au.paused?play():pause();
$("prev").onclick=prevTrack;$("next").onclick=()=>go(1);
$("shufBtn").onclick=()=>{set({shuffle:!st.shuffle});pre=null;sync()};
$("repBtn").onclick=()=>{set({repeat:{off:"all",all:"one",one:"off"}[st.repeat]});sync()};
function media(t){
 if(!("mediaSession"in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.director,album:"Rishi Music"});
 const h={play,pause,nexttrack:()=>go(1),previoustrack:prevTrack,seekto:e=>{au.currentTime=e.seekTime}};
 for(const k in h)try{navigator.mediaSession.setActionHandler(k,h[k])}catch(e){}
}

/* Card actions */
$("list").onclick=async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==="play"){const i=+b.dataset.i;if(i===cur)au.paused?play():pause();else{if(await load(i))play()}}
 else if(a==="fav"){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];jset("rishi_favs",favs);tab==="fav"?render():refresh()}
 else if(a==="edit"){const t=tracks.find(x=>x.id===id),n=prompt("Song title:",t.title);if(n===null)return;const d=prompt("Music director:",t.director);
  if(!n.trim())return;t.title=n.trim();t.director=(d||"").trim()||"UNKNOWN DIRECTOR";const r=await getRec(id);await putRecs([{...r,title:t.title,director:t.director}]);if(tracks[cur]?.id===id){$("dT").textContent=t.title;$("dS").textContent=t.director}dirs();render()}
 else if(a==="del"){
  const t=tracks.find(x=>x.id===id);
  if(!t||!confirm('Delete "'+t.title+'"?'))return;
  await delRec(id);
  const i=tracks.indexOf(t);
  if(i===cur){
   au.pause();au.removeAttribute("src");cur=-1;
   $("dT").textContent="No track playing";
   $("dS").textContent="Select a song from your library";
  }else if(i<cur){
   cur--;
  }
  tracks.splice(i,1);favs=favs.filter(x=>x!==id);jset("rishi_favs",favs);dirs();render();
 }
};

/* Import */
$("imp").onclick=()=>{$("files").value="";$("files").click()};
$("files").onchange=async e=>{
 const fs=[...e.target.files];if(!fs.length)return;
 const d=(prompt("Music director for these song(s):","UNKNOWN DIRECTOR")||"").trim()||"UNKNOWN DIRECTOR";
 $("imp").disabled=true;let n=0;
 for(let i=0;i<fs.length;i+=15){
  const recs=fs.slice(i,i+15).map(f=>({id:"track_"+Date.now()+"_"+Math.random().toString(36).slice(2,9),title:f.name.replace(/\.[^.]+$/,""),director:d,blob:f}));
  recs.forEach(r=>tracks.push({id:r.id,title:r.title,director:r.director}));n+=recs.length;
  $("imp").textContent=`Saving ${n}/${fs.length}…`;await putRecs(recs);await new Promise(r=>setTimeout(r,40));
 }
 $("imp").disabled=false;$("imp").textContent="+ Import";dirs();render();
};

/* Voice search */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$("mic").onclick=()=>{
 if(!SR)return alert("Voice search isn't supported in this browser. Try Chrome or Edge.");
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=navigator.language||"en-IN";rec.interimResults=true;
 rec.onstart=()=>$("mic").classList.add("on");
 rec.onresult=e=>{$("q").value=[...e.results].map(r=>r[0].transcript).join("").replace(/[.]$/,"");render()};
 rec.onerror=e=>{if(e.error==="not-allowed")alert("Microphone permission denied.")};
 rec.onend=()=>{$("mic").classList.remove("on");rec=null};
 rec.start();
};

/* Settings UI */
const bind=(id,key,conv=x=>x,evt="change")=>$(id).addEventListener(evt,()=>{
 const el=$(id);set({[key]:conv(el.type==="checkbox"?el.checked:el.value)});
 if(["sort","view"].includes(key))render();if(key==="gapless")pre=null;sync()});
function sync(){
 for(const[id,k]of[["theme","theme"],["autoplay","autoplay"],["gapless","gapless"],["cf","crossfade"],["vol","volume"],["spd","speed"],["remember","remember"],["shuffle","shuffle"],["repeat","repeat"],["sort","sort"],["view","view"],["anim","anim"],["compact","compact"],["art","art"]]){
  const el=$(id);if(el.type==="checkbox")el.checked=!!st[k];else el.value=String(st[k])}
 $("cfv").textContent=st.crossfade+"s";$("vv").textContent=st.volume+"%";
}
bind("theme","theme");bind("autoplay","autoplay");bind("gapless","gapless");bind("cf","crossfade",Number,"input");bind("vol","volume",Number,"input");
bind("spd","speed",Number);bind("remember","remember");bind("shuffle","shuffle");bind("repeat","repeat");bind("sort","sort");bind("view","view");
bind("anim","anim");bind("compact","compact");bind("art","art");
let pend=st.accent;
function preview(h){pend=h;$("cp").value=h;$("hx").value=h.toUpperCase();const[r,g,b]=rgbOf(h);$("r").value=r;$("g").value=g;$("b").value=b;$("pv").style.setProperty("--pc",h)}
$("cp").oninput=()=>preview($("cp").value);
$("hx").onchange=()=>{const v=$("hx").value.trim();/^#[0-9a-f]{6}$/i.test(v)?preview(v.toLowerCase()):($("hx").value=pend.toUpperCase())};
["r","g","b"].forEach(k=>$(k).oninput=()=>preview(toHex($("r").value,$("g").value,$("b").value)));
$("apply").onclick=()=>set({accent:pend});
$("resetA").onclick=()=>{set({theme:DEF.theme,accent:DEF.accent,anim:true,compact:false,art:true});sync();preview(DEF.accent)};
$("settingsBtn").onclick=()=>{sync();preview(st.accent);$("cnt").textContent=tracks.length;
 navigator.storage?.estimate?.().then(i=>{const m=(i.usage||0)/1048576;$("stor").textContent=m>1024?(m/1024).toFixed(2)+" GB":m.toFixed(1)+" MB"}).catch(()=>$("stor").textContent="Unavailable");
 $("sm").classList.add("open")};
const close=()=>$("sm").classList.remove("open");$("sx").onclick=$("done").onclick=close;$("sm").onclick=e=>{if(e.target===$("sm"))close()};
$("exp").onclick=()=>{
 const data={app:"Rishi Music",exported:new Date().toISOString(),settings:st,favourites:favs,playCounts:plays,recent,tracks};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="rishi-music-backup.json";a.click();
 alert("Backup saved: song list, favourites, play counts and settings.\nAudio files stay in your device storage.");
};

/* Install */
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("installBtn").style.display=""});
$("installBtn").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("installBtn").style.display="none"};

/* Init */
apply();sync();
initDB().then(async()=>{
 tracks=await allMeta();dirs();render();
 const p=jget("rishi_pos",null);
 if(st.remember&&p){const i=tracks.findIndex(t=>t.id===p.id);if(i>=0&&await load(i)){au.addEventListener("loadedmetadata",()=>{au.currentTime=p.t||0},{once:true})}}
}).catch(e=>{console.error(e);alert("Unable to open your music library. Please don't clear browser storage.")});
</script></body></html>
